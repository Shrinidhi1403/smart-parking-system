spring.application.name=smart-parking
server.port=8080

# H2 In-Memory Database Settings
spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# H2 Browser Console Enable (Browser mein DB tables dekhne ke liye)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Startup par dummy parking slots load karne ke liye
spring.sql.init.mode=always